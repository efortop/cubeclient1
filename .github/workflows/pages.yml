name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          # Пробуем включить Pages автоматически (source: GitHub Actions)
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # Безопасный дефолт, если configure-pages не сработал
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Подсказка, если Pages выключен
        if: failure()
        run: |
          {
            echo "### Нужен один клик, чтобы включить сайт"
            echo ""
            echo "1. Откройте **Settings → Pages**: https://github.com/${{ github.repository }}/settings/pages"
            echo "2. В **Build and deployment → Source** выберите **GitHub Actions**."
            echo "3. Запустите workflow заново: Actions → Deploy to GitHub Pages → Re-run jobs."
            echo ""
            echo "Сайт появится по адресу: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } >> "$GITHUB_STEP_SUMMARY"
