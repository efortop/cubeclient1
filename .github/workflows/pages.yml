name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          repo="${{ github.repository }}"
          if gh api "repos/$repo/pages" >/dev/null 2>&1; then
            echo "GitHub Pages уже включён"
          else
            echo "Включаю GitHub Pages (source: GitHub Actions)"
            gh api --method POST "repos/$repo/pages" \
              -f build_type=workflow >/dev/null 2>&1 \
              || echo "::notice title=Включите GitHub Pages вручную::Settings → Pages → Source: GitHub Actions"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
